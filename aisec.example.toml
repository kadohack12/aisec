# Configuration aisec
# Copier en ./aisec.toml (projet) ou ~/.config/aisec/config.toml (global).

# Backend LLM: "ollama" (local, recommande), "openai", "groq", "none" (heuristique seule).
provider = "ollama"

# Modele Ollama. Ex: llama3.1, qwen2.5, mistral, llama3.2:3b
model = "llama3.1"

# Serveur Ollama local.
ollama_host = "http://localhost:11434"

# --- Si provider = "openai" ou "groq" (donnees envoyees a l'API) ---
# api_base = "https://api.openai.com/v1"
# api_base = "https://api.groq.com/openai/v1"
# model = "gpt-4o-mini"
# La cle peut aussi venir de la variable d'environnement AISEC_API_KEY / OPENAI_API_KEY / GROQ_API_KEY.
# api_key = "..."

temperature = 0.1
timeout = 120.0

# Securite
dry_run = false      # true = n'execute jamais, affiche seulement la commande
assume_yes = false   # true = ne demande pas confirmation

# --- Niveau 2 : politique de controle ---
auto_approve_risk = "low"   # low | medium | high | critical (risque max sans confirmation)
max_targets = 16            # nombre max de cibles par commande
deny_private_targets = false  # true = refuser les cibles privees/internes

# --- Selection d'expert (routage) ---
# "heuristic" (defaut, deterministe) ou "llm" (le LLM choisit la classe).
routing = "heuristic"

# --- IA dediee par expert (une IA entrainee par classe) ---
# Chaque expert peut utiliser son propre modele; sinon `model` ci-dessus.
# [expert_models]
# dns = "aisec-dns:latest"
# web = "aisec-web:latest"
# password = "aisec-password:latest"

# --- Niveau 3 : politique de risque par classe ---
# Surcharge des politiques par defaut (classes offensives deja durcies).
# Les cles absentes gardent la politique par defaut.
# [expert_policies]
# exploitation = { max_auto_risk = "low", require_confirmation = true }
# wireless = { max_auto_risk = "medium", require_confirmation = true }
# forensics = { require_confirmation = true }

