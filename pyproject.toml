[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aisec"
version = "0.1.0"
description = "AI-native security tooling suite: piloter nmap, tshark et consorts en langage naturel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
ui = ["rich>=13"]
dev = ["pytest>=8"]

[project.scripts]
aisec = "aisec.cli:main"
nmapAI = "aisec.cli:main_nmap"
tsharkAI = "aisec.cli:main_tshark"
dnsAI = "aisec.cli:main_dns"
infoAI = "aisec.cli:main_info"
vulnerabilityAI = "aisec.cli:main_vulnerability"
webappAI = "aisec.cli:main_webapp"
passwordsAI = "aisec.cli:main_passwords"
sniffingAI = "aisec.cli:main_sniffing"
exploitationAI = "aisec.cli:main_exploitation"
forensicsAI = "aisec.cli:main_forensics"

[tool.hatch.build.targets.wheel]
packages = ["aisec"]

[tool.hatch.build.targets.wheel.force-include]
"aisec/catalog/data/parrot_tools.json" = "aisec/catalog/data/parrot_tools.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
